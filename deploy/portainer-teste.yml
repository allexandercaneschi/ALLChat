# ALLChat - stack de TESTE para o Portainer
# Mesmo formato da stack de produção do Chatwoot, com banco, Redis e porta próprios.
# Acesso: http://IP-DO-SERVIDOR:3101

services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - allchat_teste_postgres:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - allchat_teste_redis:/data

  web:
    image: ghcr.io/allexandercaneschi/allchat:all-main
    extra_hosts:
      - "whatsapp.alltecnologias.com.br:172.16.0.243"
    dns:
      - 172.16.0.254
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - '3101:3000'
    environment: &env
      - SAFE_FETCH_ALLOW_PRIVATE_NETWORK=true
      - FRONTEND_URL=${FRONTEND_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=allchat
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=redis://default:${REDIS_PASSWORD}@redis:6379
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - ENABLE_ACCOUNT_SIGNUP=false
      # Google Contatos (opcional)
      - GOOGLE_CONTACTS_CLIENT_ID=${GOOGLE_CONTACTS_CLIENT_ID}
      - GOOGLE_CONTACTS_CLIENT_SECRET=${GOOGLE_CONTACTS_CLIENT_SECRET}
      # Fotos do WhatsApp via Evolution (opcional)
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE}
    volumes:
      - allchat_teste_storage:/app/storage
    command: ["sh", "-c", "bundle exec rails db:prepare && bundle exec rails s -p 3000 -b 0.0.0.0"]

  sidekiq:
    image: ghcr.io/allexandercaneschi/allchat:all-main
    extra_hosts:
      - "whatsapp.alltecnologias.com.br:172.16.0.243"
    dns:
      - 172.16.0.254
    restart: always
    depends_on:
      - postgres
      - redis
    environment: *env
    volumes:
      - allchat_teste_storage:/app/storage
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

volumes:
  allchat_teste_postgres:
  allchat_teste_redis:
  allchat_teste_storage:
