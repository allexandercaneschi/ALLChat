# ALLChat: builds the fork's Docker image and publishes it to GitHub Container Registry.
#
# - push to feat/** or all/**  -> ghcr.io/<owner>/allchat:<branch> and :sha-<commit>  (testing)
# - push of a tag v*            -> ghcr.io/<owner>/allchat:<version>, :latest and :sha-<commit>  (production)
#
# Production uses :latest, so it only changes when a version tag is published.

name: ALLChat - Docker image

on:
  push:
    branches:
      - 'feat/**'
      - 'all/**'
    paths-ignore:
      - '.github/**'
      - 'deploy/**'
      - 'spec/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name and tags
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/allchat"
          REF_TAG=$(echo '${{ github.ref_name }}' | sed 's/\//-/g')
          TAGS="${IMAGE}:${REF_TAG},${IMAGE}:sha-${GITHUB_SHA::7}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "TAGS=${TAGS}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
